# SEC-05 / SEC-08 (VAL oleada 2): configuracion de gitleaks para CI.
# Extiende las reglas por defecto de gitleaks y solo agrega excepciones para falsos positivos
# conocidos, cada una con su motivo. Revisar las excepciones el 2027-02-12.
# El CI escanea solo los commits del PR/push (--log-opts con el rango): el historial viejo tiene
# valores que quedaron invalidados con la rotacion de credenciales y no se reescribe.
title = "AsistenciasUCO gitleaks config"

[extend]
useDefault = true

# Digests SHA-256 (64 hex) citados como evidencia en documentacion (OpenAPI SHA, artefactos, imagenes).
# Un digest no es una credencial. Solo aplica a Markdown dentro de docs/.
[[allowlists]]
description = "SHA-256 digests in documentation"
condition = "AND"
paths = ['''(^|/)docs/.*\.md$''']
regexTarget = "secret"
regexes = ['''^[A-Fa-f0-9]{64}$''']

# Contrasena inventada de la prueba AltaUsuarioSinAmbitoRetiradaTest (alta retirada: nunca llega a Keycloak).
[[allowlists]]
description = "Fake password literal used by backend unit tests"
regexTarget = "match"
regexes = ['''NoSeUsa-[A-Za-z0-9-]+''']

# Literales inventados de pruebas (GreenMail, fixtures de paridad JPA). No son credenciales reales:
# las pruebas corren contra servicios efimeros o dobles de prueba.
[[allowlists]]
description = "Fake literals used by backend tests"
condition = "AND"
paths = ['''(^|/)src/test/''']
regexTarget = "match"
regexes = ['''DatoUltraSecretoDeCuerpo[0-9]+''', '''Clave-IT-[A-Za-z0-9-]+''']

# Trace IDs W3C (32 hex) fijados en pruebas de auditoria/trazas: son identificadores, no secretos.
[[allowlists]]
description = "W3C trace ids in tests"
condition = "AND"
paths = ['''(^|/)src/test/''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{32}$''']

# Fila de la tabla de la Definition of Done: la regla generica confunde la palabra "API" con una clave.
[[allowlists]]
description = "Definition of Done table row"
condition = "AND"
paths = ['''(^|/)docs/baseline/DEFINITION_OF_DONE\.md$''']
regexTarget = "line"
regexes = ['''^\| Alcance y contrato \|''']
