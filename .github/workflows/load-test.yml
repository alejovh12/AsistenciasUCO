name: Load Test (manual)

# VAL-oleada3 (REA-01 / REA-06): prueba de carga k6 bajo demanda contra un entorno YA desplegado (staging/lab).
# Solo workflow_dispatch: nunca corre en PR ni en push. El script es el mismo de la corrida local
# (scripts/load/k6/carga-lectura.js) y la imagen de k6 es la oficial fijada por digest.
# Tokens: el secreto LOAD_TEST_TOKENS_JSON trae {"ESTUDIANTE": "...", "DOCENTE": "...", "COORDINADOR": "..."} de usuarios de
# PRUEBA del entorno objetivo (vida corta; se cargan justo antes de lanzar). Nunca se imprime; el archivo vive en $RUNNER_TEMP.
# Sin el secreto, el job solo valida el script (k6 inspect) y termina.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL base del backend o del balanceador (https://...)
        required: true
      vus:
        description: Usuarios virtuales en meseta
        required: false
        default: '10'
      duration:
        description: Duración de la meseta (k6, p. ej. 2m)
        required: false
        default: '2m'
      mode:
        description: normal | dependencia-caida
        required: false
        default: normal

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false

env:
  K6_IMAGE: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d

jobs:
  load-test:
    name: k6 carga-lectura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          BASE_URL: ${{ inputs.base_url }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$BASE_URL" =~ ^https?://[A-Za-z0-9.:-]+(/.*)?$ ]] || { echo "base_url invalida"; exit 1; }
          [[ "$VUS" =~ ^[0-9]{1,3}$ ]] || { echo "vus invalido"; exit 1; }
          [[ "$DURATION" =~ ^[0-9]+[smh]$ ]] || { echo "duration invalida"; exit 1; }
          [[ "$MODE" == normal || "$MODE" == dependencia-caida ]] || { echo "mode invalido"; exit 1; }

      - name: Write tokens (secret, not printed)
        id: tokens
        env:
          LOAD_TEST_TOKENS_JSON: ${{ secrets.LOAD_TEST_TOKENS_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/k6/out"
          if [ -z "$LOAD_TEST_TOKENS_JSON" ]; then
            echo '{"ESTUDIANTE":"x","DOCENTE":"x","COORDINADOR":"x"}' > "$RUNNER_TEMP/k6/tokens.json"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$LOAD_TEST_TOKENS_JSON" > "$RUNNER_TEMP/k6/tokens.json"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate script (k6 inspect)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/scripts/load/k6:/scripts:ro" -v "$RUNNER_TEMP/k6:/work" \
            "$K6_IMAGE" inspect /scripts/carga-lectura.js > /dev/null

      - name: Run load test
        if: steps.tokens.outputs.present == 'true'
        # shell: bash explicito => -o pipefail: el exit code de k6 (99 = umbral incumplido) no se pierde en el tee.
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          MODE: ${{ inputs.mode }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/scripts/load/k6:/scripts:ro" -v "$RUNNER_TEMP/k6:/work" \
            -e BASE_URL -e VUS -e DURATION -e MODE -e TOKENS_FILE=/work/tokens.json -e SUMMARY_FILE=/work/out/summary.json \
            "$K6_IMAGE" run --quiet /scripts/carga-lectura.js | tee "$RUNNER_TEMP/k6/out/summary.txt"

      - name: Remove tokens
        if: always()
        run: rm -f "$RUNNER_TEMP/k6/tokens.json"

      - name: Upload summary
        if: always() && steps.tokens.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: ${{ runner.temp }}/k6/out/
          retention-days: 30
