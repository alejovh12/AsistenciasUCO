name: Backend Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Backend Integration Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.CI_SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_SPRING_DATASOURCE_PASSWORD }}
      APP_DATABASE_EXPECTED_NAME: ${{ vars.CI_APP_DATABASE_EXPECTED_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate integration configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD
            APP_DATABASE_EXPECTED_NAME
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required CI integration setting: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          chmod +x mvnw
          ./mvnw -version

      - name: Run integration profile
        shell: bash
        run: ./mvnw -B -ntp --no-transfer-progress clean verify -Pintegration

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-surefire-${{ github.run_id }}
          path: target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-failsafe-${{ github.run_id }}
          path: target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
