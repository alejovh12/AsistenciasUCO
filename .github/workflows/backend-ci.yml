name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - master

  push:
    branches:
      - develop
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          chmod +x mvnw
          ./mvnw -version

      - name: Maven clean verify
        shell: bash
        run: |
          set -euo pipefail

          ./mvnw \
            -B \
            -ntp \
            --no-transfer-progress \
            clean verify

      - name: Assert JaCoCo coverage report exists
        shell: bash
        run: |
          set -euo pipefail

          test -s target/site/jacoco/jacoco.xml
          test -s target/site/jacoco/index.html

          echo "JaCoCo XML: target/site/jacoco/jacoco.xml"
          echo "JaCoCo HTML: target/site/jacoco/index.html"

      - name: SonarQube Cloud analysis and Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          ./mvnw \
            -B \
            -ntp \
            --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization=alejovh12 \
            -Dsonar.projectKey=alejovh12_AsistenciasUCO \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Assert packaged application artifact exists
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/AsistenciasUCO-0.0.1-SNAPSHOT.jar"

          test -s "$JAR"

          echo "Packaged artifact: $JAR"
          sha256sum "$JAR"

      - name: Build production Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --tag asistencias-uco-backend:${{ github.sha }} \
            .

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report-${{ github.run_id }}
          path: |
            target/site/jacoco/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: asistencias-uco-backend-${{ github.sha }}
          path: target/AsistenciasUCO-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
