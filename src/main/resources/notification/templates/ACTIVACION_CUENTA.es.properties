asunto = Active su cuenta en la plataforma de asistencia
cuerpo = Hola {nombre}, se registró una cuenta a su nombre como {rol} en la plataforma de asistencia de la Universidad Católica de Oriente. Para activarla y definir su contraseña abra el siguiente enlace: {enlace} . El enlace es de un solo uso y vence pronto; si vence, pida a quien lo registró que se lo envíe de nuevo. Si usted no esperaba este mensaje, ignórelo.
marcadores.obligatorios = nombre,enlace,rol
