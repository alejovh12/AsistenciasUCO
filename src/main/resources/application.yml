        "[ERR_TIPO_IDENTIFICACION_CODIGO_REQUERIDO]": ERR103
        "[ERR_TIPO_IDENTIFICACION_INVALIDA]": ERR104
        "[ERR_TIPO_IDENTIFICACION_NOMBRE_LONGITUD_INVALIDA]": ERR105
