        "[ERR_TOMA_NO_RECLAMABLE]": ERR110
        "[ERR_USUARIO_DOCENTE_INVALIDO]": ERR111
        "[ERR_USUARIO_DOCENTE_REQUERIDO]": ERR112
        "[ERR_USUARIO_EJECUTOR_ASISTENCIA_REQUERIDO]": ERR113
        "[ERR_USUARIO_INACTIVO]": ERR114
        "[ERR_USUARIO_INVALIDO]": ERR115
        "[ERR_USUARIO_REQUERIDO]": ERR116
        "[ERR_CORREO_REQUERIDO_MATRICULA]": ERR117
        "[ERR_ANTIVIRUS_NO_DISPONIBLE]": ERR118
    # Azure Key Vault y App Configuration (autenticacion por DefaultAzureCredential con Azure CLI).
    # SEC-12: sin nombres de recursos reales por defecto. Con un proveedor Azure activo y el endpoint vacio, el arranque
    # falla con un mensaje claro; los perfiles local/dev usan proveedores sin Azure salvo que se definan las variables.
    azure-keyvault:
      endpoint: ${AZURE_KEYVAULT_ENDPOINT:}
    azure-appconfig:
      endpoint: ${AZURE_APPCONFIG_ENDPOINT:}
    # Identity provisioning administrativo (crear/verificar/eliminar cuentas institucionales
    # y asignar client roles vía Admin REST API). NO confundir con keycloak-security: esto
    # nunca participa en la validación de JWT de cada request. Ver
    # docs/security/keycloak-identity-provider.md.
    keycloak-identity:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:asistencias-uco}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:asistencias-backend-admin}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      api-client-id: ${KEYCLOAK_API_CLIENT_ID:asistencias-api}
      user-id-attribute: ${KEYCLOAK_USER_ID_ATTRIBUTE:idUsuario}
    # Aprovisionamiento de identidades del modo baseline (realm central). El secreto no tiene valor por defecto.
    security-baseline-identity:
      server-url: ${SECURITY_BASELINE_IDENTITY_SERVER_URL:http://localhost:19090}
      realm: ${SECURITY_BASELINE_IDENTITY_REALM:security-baseline}
      admin-client-id: ${SECURITY_BASELINE_IDENTITY_ADMIN_CLIENT_ID:asistencias-provisioner}
      admin-client-secret: ${SECURITY_BASELINE_IDENTITY_ADMIN_CLIENT_SECRET:}
      api-client-id: ${SECURITY_BASELINE_API_CLIENT_ID:asistencias-api}
      user-id-attribute: ${SECURITY_BASELINE_USER_ID_CLAIM:idUsuario}
    # Runtime security legacy (validacion de JWT). Ver
    # docs/security/runtime-security-provider-architecture.md.
    keycloak-security:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/asistencias-uco}
      api-client-id: ${KEYCLOAK_API_CLIENT_ID:asistencias-api}
      expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:asistencias-api}
      user-id-claim: ${KEYCLOAK_USER_ID_CLAIM:idUsuario}
    security-baseline:
      issuer-uri: ${SECURITY_BASELINE_ISSUER_URI:http://keycloak.localhost:19090/realms/security-baseline}
      # Cliente de recurso propio de AsistenciasUCO en el realm central: aporta los cinco roles institucionales
      # (resource_access) y la audiencia del backend. No se usa security-baseline-pdp: ese cliente es del PDP.
      api-client-id: ${SECURITY_BASELINE_API_CLIENT_ID:asistencias-api}
      expected-audience: ${SECURITY_BASELINE_EXPECTED_AUDIENCE:asistencias-api}
      email-claim: ${SECURITY_BASELINE_EMAIL_CLAIM:email}
      email-verified-claim: ${SECURITY_BASELINE_EMAIL_VERIFIED_CLAIM:email_verified}
      # Atributo del IdP con Usuario.id (solo coherencia/UI; la autoridad es el vínculo issuer+subject en SQL Server).
      user-id-claim: ${SECURITY_BASELINE_USER_ID_CLAIM:idUsuario}
      # Opcional: solo transporte de las claves publicas (el `iss` se valida siempre contra issuer-uri). Vacio = descubrimiento OIDC.
      jwk-set-uri: ${SECURITY_BASELINE_JWK_SET_URI:}
    # Perfiles de acceso en el PDP: el backend asegura (idempotente) el perfil equivalente a cada rol que asigna.
    # La sincronizacion privilegiada permanece deshabilitada hasta validar la autorizacion administrativa del PDP.
    security-baseline-pdp-admin:
      enabled: ${SECURITY_BASELINE_PDP_PROFILE_SYNC_ENABLED:false}
      pdp-url: ${SECURITY_BASELINE_PDP_URL:http://localhost:18080}
      token-url: ${SECURITY_BASELINE_IDENTITY_SERVER_URL:http://localhost:19090}/realms/${SECURITY_BASELINE_IDENTITY_REALM:security-baseline}/protocol/openid-connect/token
      client-id: ${SECURITY_BASELINE_PDP_ADMIN_CLIENT_ID:asistencias-provisioner}
      # Secreto dedicado del PDP; no reutilizar SECURITY_BASELINE_IDENTITY_ADMIN_CLIENT_SECRET.
      client-secret: ${SECURITY_BASELINE_PDP_ADMIN_CLIENT_SECRET:}
      application-name: ${SECURITY_BASELINE_PEP_APPLICATION_NAME:asistencias-uco}
      # Perfil individual del PDP por rol (fuente unica: infra/security-baseline/access-catalog.json).
      profiles:
        ADMINISTRADOR: Administración institucional
        DECANO: Decanatura
        COORDINADOR: Coordinación de programa
        DOCENTE: Docencia
        ESTUDIANTE: Estudiantes
    # El modo baseline exige esta configuración; no existe una bandera adicional para apagarlo.
    security-baseline-pep:
      pep-url: ${SECURITY_BASELINE_PEP_URL:http://localhost:18081}
      application-name: ${SECURITY_BASELINE_PEP_APPLICATION_NAME:asistencias-uco}
      # Contrato 0.1.7: dev | lab | prod (el PDP rechaza cualquier otro valor al validar la credencial).
      environment: ${SECURITY_BASELINE_PEP_ENVIRONMENT:dev}
      application-credential: ${SECURITY_BASELINE_PEP_APPLICATION_CREDENTIAL:}
      connect-timeout: ${SECURITY_BASELINE_PEP_CONNECT_TIMEOUT:2s}
      request-timeout: ${SECURITY_BASELINE_PEP_REQUEST_TIMEOUT:5s}
    # LB-004B.2: MinIO privado (bucket provisionado por docker-compose/minio-init). Credenciales
    # SOLO por variables de entorno, sin valor por defecto funcional (fail-fast si faltan).
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:asistencias-soportes}
      # Acotan el bloqueo si MinIO acepta la conexion y no responde (el SDK espera 5 min por defecto).
      connect-timeout-millis: ${MINIO_CONNECT_TIMEOUT_MILLIS:5000}
      write-timeout-millis: ${MINIO_WRITE_TIMEOUT_MILLIS:30000}
      read-timeout-millis: ${MINIO_READ_TIMEOUT_MILLIS:30000}
    # LB-004B.2: ClamAV local via protocolo clamd/INSTREAM.
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout-millis: ${CLAMAV_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${CLAMAV_READ_TIMEOUT_MILLIS:15000}
    outbox-notification:
      sender: ${OUTBOX_NOTIFICATION_SENDER:log}               # log | smtp
      dispatcher-enabled: ${OUTBOX_NOTIFICATION_DISPATCHER_ENABLED:true}
      batch-size: ${OUTBOX_NOTIFICATION_BATCH_SIZE:50}        # 1..500
      lease: ${OUTBOX_NOTIFICATION_LEASE:60s}                 # 5s..1h
      sweeper-interval: ${OUTBOX_NOTIFICATION_SWEEPER_INTERVAL:30s}   # 1s..1h
      max-attempts: ${OUTBOX_NOTIFICATION_MAX_ATTEMPTS:5}     # 1..20
      backoff-base: ${OUTBOX_NOTIFICATION_BACKOFF_BASE:30s}   # 1s..1h
      backoff-max: ${OUTBOX_NOTIFICATION_BACKOFF_MAX:15m}     # >= base, <= 24h
      retention-days: ${OUTBOX_NOTIFICATION_RETENTION_DAYS:30}   # 1..3650
      retention-interval: ${OUTBOX_NOTIFICATION_RETENTION_INTERVAL:6h}
      instance-id: ${OUTBOX_NOTIFICATION_INSTANCE_ID:}        # vacío => <hostname>-<8 hex aleatorios>
    smtp-notification:
      host: ${SMTP_NOTIFICATION_HOST:}
      port: ${SMTP_NOTIFICATION_PORT:587}
      username: ${SMTP_NOTIFICATION_USERNAME:}
      password: ${SMTP_NOTIFICATION_PASSWORD:}                # nunca en el repositorio
      starttls: ${SMTP_NOTIFICATION_STARTTLS:true}
      ssl: ${SMTP_NOTIFICATION_SSL:false}
      from-address: ${SMTP_NOTIFICATION_FROM_ADDRESS:}
      from-name: ${SMTP_NOTIFICATION_FROM_NAME:Asistencia UCO}
      connect-timeout: ${SMTP_NOTIFICATION_CONNECT_TIMEOUT:10s}
      read-timeout: ${SMTP_NOTIFICATION_READ_TIMEOUT:20s}
      max-bcc: ${SMTP_NOTIFICATION_MAX_BCC:50}                # 1..100
      rate-per-minute: ${SMTP_NOTIFICATION_RATE_PER_MINUTE:60}     # 1..10000
      rate-per-day: ${SMTP_NOTIFICATION_RATE_PER_DAY:500}          # >= rate-per-minute
      require-confirmed-email: ${SMTP_NOTIFICATION_REQUIRE_CONFIRMED_EMAIL:false}
      platform-url: ${SMTP_NOTIFICATION_PLATFORM_URL:}        # vacío => el correo no incluye enlace (si se define: http:// o https://)
      template-cache-ttl: ${SMTP_NOTIFICATION_TEMPLATE_CACHE_TTL:60s}
      test-mode:
        enabled: ${SMTP_NOTIFICATION_TEST_MODE_ENABLED:false} # D15: true => redirige TODO a redirect-to
        redirect-to: ${SMTP_NOTIFICATION_TEST_MODE_REDIRECT_TO:} # 1..5 direcciones separadas por coma; obligatorio si enabled=true

  # SEC-02 (VAL-oleada3-baul-secretos): con app.adapters.vault.provider=azure_keyvault los secretos de ejecucion
  # (BD, Keycloak, PDP/PEP, MinIO, SMTP, webhook Event Grid) se leen del baul al arrancar; un secreto ausente en el baul
  # cae a su variable de entorno. Inventario: docs/security/SECRETS_INVENTORY.md. false desactiva solo esta carga.
  secrets:
    runtime-from-vault:
      enabled: ${APP_SECRETS_RUNTIME_FROM_VAULT_ENABLED:true}

  # CORS es neutral (no conoce ningun proveedor de identidad); SecurityConfig lo lee
  # directamente via @Value.
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    headers:
      # CF-05: Strict-Transport-Security solo se escribe en peticiones HTTPS; false lo omite por completo.
      hsts-enabled: ${APP_SECURITY_HSTS_ENABLED:true}
    azure-events:
      # Sin valor por defecto funcional: vacio = webhook Event Grid rechaza todo (401, fail-closed).
      webhook-token: ${AZURE_EVENTGRID_WEBHOOK_TOKEN:}
