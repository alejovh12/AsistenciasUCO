spring:
  application:
    name: asistencias-uco
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    # F12-08 (VAL-oleada3): pool dimensionado por variable y por réplica. Conexiones totales = réplicas x maximum-pool-size
    # (2 x 10 = 20 en la prueba de dos réplicas); debe quedar por debajo del tope del login de la aplicación en SQL Server.
    # Los valores por defecto son los de Hikari (sin cambio de comportamiento). Sizing: docs/work-items/VAL-oleada3-carga/PLAN.md.
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
  # LB-008 / JPA-02A: bootstrap JPA estandar de Spring Boot. Hibernate no administra el schema;
  # ddl-auto permanece deshabilitado y el acceso a metadata JDBC se controla desde la configuracion JPA.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  lifecycle:
    # F12-09: tope del apagado elegante por fase (por debajo de los 30 s que Docker/Kubernetes esperan antes de SIGKILL).
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}
  main:
    web-application-type: servlet
    keep-alive: true
  http:
    converters:
      # Boot 4 puede detectar Jackson 2 por dependencias transitivas del proveedor de identidad.
      # El valor "jackson" selecciona el mapper Jackson 3 configurado en Infrastructure.
      preferred-json-mapper: jackson
  threads:
    virtual:
      enabled: true
  # LB-004B.2: limite de 5 MiB alineado con ContentSecurityValidator.MAX_FILE_SIZE_BYTES.
  # El threshold igual al maximo contractual mantiene en memoria los archivos validos (<= 5 MiB).
  # Esto elimina persistencia contractual/local del archivo; no significa que la JVM no use
  # memoria transitoria durante la request.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB

server:
  port: 8080
  # F12-09 (desechabilidad): ante SIGTERM se deja de aceptar trafico y se terminan las peticiones en curso, con el tope
  # por fase de spring.lifecycle.timeout-per-shutdown-phase. Los schedulers y el dispatcher ya paran en SmartLifecycle.stop().
  shutdown: graceful
  # CULM-001 A.2-5: el despacho ERROR (excepcion en un filtro) nunca expone traza, mensaje ni excepcion.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

asistencias:
  swagger-ui:
    enabled: ${ASISTENCIAS_SWAGGER_UI_ENABLED:false}

management:
  # CULM-001 D.9-a (F-TRX-020): Actuator y Prometheus salen por un puerto de gestion propio, solo en loopback; el puerto de la
  # API ya no responde /actuator/prometheus (la recoleccion de Prometheus apunta a 127.0.0.1:${MANAGEMENT_SERVER_PORT:8090}).
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
    # Seguro por defecto (loopback). Solo en desarrollo local, para que Prometheus en Docker llegue, usar MANAGEMENT_SERVER_ADDRESS=0.0.0.0
    # y nunca exponer ese puerto fuera de la maquina (ver docs/observability/README.md).
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # OBS-10 / F12-09: sondas de liveness y readiness en el puerto de gestion (/actuator/health/liveness y /readiness).
  # Liveness solo mira el estado interno de la JVM (una dependencia caida nunca debe reiniciar el contenedor).
  # Readiness agrega la BD (db) y el estado de los circuit breakers del PEP, MinIO y ClamAV (circuitBreakers, sin llamadas
  # de red extra). Un breaker abierto se informa como CIRCUIT_OPEN, que no tumba la readiness: con el PEP caido todas las
  # replicas responden 503 (fail-closed) y sacarlas del balanceo no restauraria el servicio.
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,circuitBreakers
  health:
    circuitbreakers:
      enabled: true
  metrics:
    distribution:
      # OBS (alerta LatenciaP95Alta de Prometheus): histograma de http.server.requests para histogram_quantile(0.95, ...).
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

# F12-11 (logs como flujo): por defecto los logs salen SOLO por stdout, en JSON estructurado (logstash). El archivo JSONL con
# rotacion es opcional: se activa definiendo ASISTENCIAS_UCO_LOG_FILE (los perfiles local y dev lo activan para el stack local
# de Alloy/Loki, que lee infra/observability/logs/*.jsonl). Vacio = sin archivo.
logging:
  file:
    name: ${ASISTENCIAS_UCO_LOG_FILE:}
  logback:
    rollingpolicy:
      file-name-pattern: ${ASISTENCIAS_UCO_LOG_FILE_PATTERN:infra/observability/logs/asistencias-uco.%d{yyyy-MM-dd}.%i.jsonl}
      max-file-size: ${ASISTENCIAS_UCO_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${ASISTENCIAS_UCO_LOG_MAX_HISTORY:7}
      total-size-cap: ${ASISTENCIAS_UCO_LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false
  pattern:
    level: "%5p [correlationId:%X{correlationId:-},traceId:%X{traceId:-},spanId:%X{spanId:-}]"
  structured:
    format:
      console: ${ASISTENCIAS_UCO_LOG_CONSOLE_FORMAT:logstash}
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ASISTENCIAS_UCO_ENVIRONMENT:local}

# ──────────────────────────────────────────────────────────────
# app.adapters.*  -> QUÉ tecnología implementa cada capability (Composition Root).
# app.providers.* -> CÓMO se configura esa tecnología ya elegida.
# Ver docs/architecture/adapter-composition-standard.md
# ──────────────────────────────────────────────────────────────
# Conexion al starter de MessageUcoLab (messageucolab-spring-boot-starter). El starter se autoconfigura aunque
# el provider activo sea otro, por eso hay valores por defecto inocuos; solo se consulta con
# app.adapters.message-catalog.provider=messageucolab. Los identificadores no son secretos (guia, paso 7).
# REA-02: circuit breakers de Resilience4j para las dependencias sincronas (PEP, MinIO, ClamAV). Solo se usan los registros
# (sin anotaciones AOP); los adaptadores secundarios los aplican. Con el breaker abierto se falla rapido y cerrado: el PEP
# responde 503, el storage StorageUnavailableException y el antivirus MalwareScanException (nunca CLEAN). El timeout por
# llamada es el del transporte de cada cliente (request-timeout del PEP, timeouts de MinIO y de ClamAV).
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${RESILIENCE_CB_SLIDING_WINDOW_SIZE:20}
        minimum-number-of-calls: ${RESILIENCE_CB_MINIMUM_NUMBER_OF_CALLS:10}
        failure-rate-threshold: ${RESILIENCE_CB_FAILURE_RATE_THRESHOLD:50}
        slow-call-duration-threshold: ${RESILIENCE_CB_SLOW_CALL_DURATION_THRESHOLD:4s}
        slow-call-rate-threshold: ${RESILIENCE_CB_SLOW_CALL_RATE_THRESHOLD:80}
        wait-duration-in-open-state: ${RESILIENCE_CB_WAIT_DURATION_IN_OPEN_STATE:30s}
        permitted-number-of-calls-in-half-open-state: ${RESILIENCE_CB_PERMITTED_CALLS_IN_HALF_OPEN_STATE:3}
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      securityBaselinePep:
        base-config: default
        wait-duration-in-open-state: ${RESILIENCE_CB_PEP_WAIT_DURATION_IN_OPEN_STATE:15s}
        slow-call-duration-threshold: ${RESILIENCE_CB_PEP_SLOW_CALL_DURATION_THRESHOLD:2s}
      fileStorage:
        base-config: default
        wait-duration-in-open-state: ${RESILIENCE_CB_STORAGE_WAIT_DURATION_IN_OPEN_STATE:30s}
        slow-call-duration-threshold: ${RESILIENCE_CB_STORAGE_SLOW_CALL_DURATION_THRESHOLD:10s}
      malwareScan:
        base-config: default
        wait-duration-in-open-state: ${RESILIENCE_CB_MALWARE_SCAN_WAIT_DURATION_IN_OPEN_STATE:30s}
        slow-call-duration-threshold: ${RESILIENCE_CB_MALWARE_SCAN_SLOW_CALL_DURATION_THRESHOLD:10s}

messageucolab:
  url: ${MESSAGEUCOLAB_URL:http://localhost:8000}
  application-id: ${MESSAGEUCOLAB_APPLICATION_ID:}
  environment-id: ${MESSAGEUCOLAB_ENVIRONMENT_ID:}

app:
  # MAINT-003F: contrato UTC v2 de sesiones. Activo por defecto en local; el verificador comprueba
  # al arrancar que la DB del ambiente tenga desplegado UTC-D06-POST-FREEZE.
  sesiones:
    v2:
      enabled: ${APP_SESIONES_V2_ENABLED:true}
  # IDENT-001: limite de intentos por IP del endpoint publico de verificacion de correo (en memoria, por instancia).
  verificacion-correo:
    limite-por-minuto: ${VERIFICACION_CORREO_LIMITE_POR_MINUTO:20}
    max-claves: ${VERIFICACION_CORREO_MAX_CLAVES:10000}
  adapters:
    identity:
      # Un solo selector (APP_ADAPTERS_SECURITY_PROVIDER) gobierna seguridad e identidad; si se define este
      # valor explicitamente debe coincidir (el arranque falla ante una combinacion mixta).
      provider: ${APP_ADAPTERS_IDENTITY_PROVIDER:${APP_ADAPTERS_SECURITY_PROVIDER:baseline}}
    security:
      # Security Baseline es el proveedor predeterminado. `legacy` (Keycloak 8081) solo se activa de forma explicita
      # y una configuracion incompleta del baseline hace fallar el arranque: nunca degrada a legacy.
      provider: ${APP_ADAPTERS_SECURITY_PROVIDER:baseline}
    vault:
      provider: ${APP_ADAPTERS_VAULT_PROVIDER:azure_keyvault}
    parameter-catalog:
      provider: ${APP_ADAPTERS_PARAMETER_CATALOG_PROVIDER:azure_appconfig}
    message-catalog:
      # azure (predeterminado) | messageucolab (componente del equipo de mensajeria) | sqlserver.
      # Guia: AsistenciasUCO-Infra/docs/hardening/MESSAGE_CATALOG_SWITCH_GUIDE.md
      provider: ${APP_ADAPTERS_MESSAGE_CATALOG_PROVIDER:azure}
    storage:
      # LB-004B.2: minio es el unico provider soportado (decision humana, ver
      # docs/work-items/LB-004-stateless-serverless-readiness/PROFESSOR_DECISION.md). No hay
      # fallback local: un valor no soportado falla el arranque (fail-closed).
      provider: ${APP_ADAPTERS_STORAGE_PROVIDER:minio}
    realtime:
      provider: ${APP_ADAPTERS_REALTIME_PROVIDER:local-sse}
    audit:
      provider: ${APP_ADAPTERS_AUDIT_PROVIDER:logging}
    notification:
      provider: ${APP_ADAPTERS_NOTIFICATION_PROVIDER:log}     # log | outbox | composite
      composite:
        targets: ${APP_ADAPTERS_NOTIFICATION_COMPOSITE_TARGETS:log,outbox}   # solo aplica con provider=composite

  providers:
    # Solo aplica con app.adapters.message-catalog.provider=messageucolab (la conexion va en `messageucolab.*`).
    messageucolab:
      timeout: ${MESSAGEUCOLAB_TIMEOUT:3s}
      cache-ttl: ${MESSAGEUCOLAB_CACHE_TTL:5m}   # 0 desactiva; el gateway limita a 120 peticiones/min por IP
      fallback: ${MESSAGEUCOLAB_FALLBACK:azure}   # azure | none
      code-prefix: ${MESSAGEUCOLAB_CODE_PREFIX:MSG_}
      # Codigos canonicos de mas de 10 caracteres -> codigo corto de MessageUcoLab (el nombre canonico va en el titulo).
      # Generado por AsistenciasUCO-Infra/components/messages/build-message-catalog.py; la prueba MessageUcoLabCatalogoTest lo valida.
      code-aliases:
        "[ERR_CORRELACION_REQUERIDA]": ERR001
        "[ERR_USUARIO_NO_EXISTE]": ERR002
        "[ERR_UNICIDAD_CORREO]": ERR003
        "[ERR_UNICIDAD_DOCUMENTO]": ERR004
        "[ERR_ESTUDIANTE_NO_EXISTE]": ERR005
