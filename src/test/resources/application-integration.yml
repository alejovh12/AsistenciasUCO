spring:
  application:
    name: asistencias-uco
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
  main:
    web-application-type: servlet
    keep-alive: true
  threads:
    virtual:
      enabled: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  adapters:
    persistence:
      provider: sqlserver
    identity:
      provider: keycloak
    security:
      provider: keycloak
    storage:
      provider: local
    realtime:
      provider: local-sse
    audit:
      provider: logging
  providers:
    keycloak-identity:
      server-url: http://127.0.0.1:65534
      realm: asistencias-uco
      admin-client-id: test-only-admin
      admin-client-secret: test-only-not-used
      api-client-id: asistencias-api
      user-id-attribute: idUsuario
    keycloak-security:
      issuer-uri: http://127.0.0.1:65534/realms/asistencias-uco
      api-client-id: asistencias-api
      expected-audience: asistencias-api
      user-id-claim: idUsuario
