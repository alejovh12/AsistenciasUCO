spring:
  application:
    name: asistencias-uco
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
  main:
    web-application-type: servlet
    keep-alive: true
  threads:
    virtual:
      enabled: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    mode: fake
  cache:
    mode: fake
  notifications:
    mode: fake
