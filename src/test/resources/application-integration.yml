spring:
  application:
    name: asistencias-uco
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
  main:
    web-application-type: servlet
    keep-alive: true
  threads:
    virtual:
      enabled: true

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  adapters:
    persistence:
      provider: sqlserver
    vault:
      provider: local_env
    parameter-catalog:
      provider: sqlserver
    message-catalog:
      provider: sqlserver
    identity:
      provider: keycloak
    security:
      provider: keycloak
    storage:
      # LB-004B.2: minio es el unico provider soportado. La construccion del bean MinioClient no
      # conecta eagerly, asi que IT que no ejercitan storage (p.ej. AsistenciaRepositorySqlServerIT)
      # no requieren MinIO corriendo; solo MinioFileStorageAdapterIT/ClamAvMalwareScanAdapterIT lo
      # necesitan realmente arriba (docker compose up -d minio clamav).
      provider: minio
    realtime:
      provider: local-sse
    audit:
      provider: logging
  providers:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:asistencias-minio-dev}
      secret-key: ${MINIO_SECRET_KEY:asistencias-minio-dev-secret}
      bucket: ${MINIO_BUCKET:asistencias-soportes}
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout-millis: 5000
      read-timeout-millis: 15000
    keycloak-identity:
      server-url: http://127.0.0.1:65534
      realm: asistencias-uco
      admin-client-id: test-only-admin
      admin-client-secret: test-only-not-used
      api-client-id: asistencias-api
      user-id-attribute: idUsuario
    keycloak-security:
      issuer-uri: http://127.0.0.1:65534/realms/asistencias-uco
      api-client-id: asistencias-api
      expected-audience: asistencias-api
      user-id-claim: idUsuario
