name: asistencias-files

x-minio-build: &minio-build
  context: ./minio
  dockerfile: Dockerfile
  args:
    MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    MC_VERSION: RELEASE.2025-08-13T08-35-41Z

services:
  minio:
    build: *minio-build
    image: asistencias-minio-community:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: "off"
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    networks: [files-backend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  minio-init:
    build: *minio-build
    image: asistencias-minio-community:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: asistencias-soportes
    entrypoint: ["/usr/local/bin/minio-init"]
    networks: [files-backend]
    restart: "no"

  minio-policy-test:
    profiles: [validation]
    build: *minio-build
    image: asistencias-minio-community:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: asistencias-soportes
    entrypoint: ["/usr/local/bin/validate-minio-policy"]
    networks: [files-backend]
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:cc16781fe005e49de6a8fc1231b63b265f74b18fc2a6347c670c35716914c3b6
    ports:
      - "127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [files-backend]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

networks:
  files-backend:
    name: asistencias-files-backend
    driver: bridge

volumes:
  minio_data:
    name: asistencias-minio-data
  clamav_data:
    name: asistencias-clamav-data
