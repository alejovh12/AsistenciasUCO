# Security Baseline 0.1.13 — instalación local ÚNICA de AsistenciasUCO.
#
# Origen: distribution/compose.yaml del release oficial de Seguridad-UCO (imágenes
# davidalzate/security-{keycloak-local,opa,pdp,pep}:${SECURITY_VERSION}), endurecido para este repositorio:
#   - proyecto Compose `asistencias-security-lab` CONSERVADO a propósito: sus volúmenes
#     (asistencias-security-lab_*-data) contienen el realm, el catálogo del PDP y las asignaciones.
#     Renombrar el proyecto dejaría esos datos huérfanos.
#   - puertos solo en 127.0.0.1 y endpoints oficiales de integración: Keycloak 19090, PDP 18080, PEP 18081.
#   - ningún secreto literal: todos llegan del env-file local %USERPROFILE%\.asistencias-security-lab\lab.env
#     (fuera de Git). Plantilla: lab.env.example.
#   - Keycloak escucha en ${KEYCLOAK_PORT} dentro de una red propia con IP fija; PDP/PEP resuelven
#     keycloak.localhost por extra_hosts hacia esa IP (el resolver de Netty trata *.localhost como loopback).
#   - NO sustituye al Keycloak legacy (infra/keycloak, puerto 8081), que es otro proyecto.
#
# Uso:  docker compose --env-file %USERPROFILE%\.asistencias-security-lab\lab.env -f infra/security-baseline/compose.yaml up -d
# Prohibido: `docker compose down -v`, `docker volume prune`, `docker system prune -a`.
name: asistencias-security-lab

services:
  keycloak:
    image: ${SECURITY_DOCKER_ORG:?Configure SECURITY_DOCKER_ORG}/security-keycloak-local:${SECURITY_VERSION:?Configure SECURITY_VERSION}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SECURITY_KC_ADMIN_USERNAME:?Configure SECURITY_KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SECURITY_KC_ADMIN_PASSWORD:?Configure SECURITY_KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://keycloak.localhost:${KEYCLOAK_PORT:-19090}
      KC_HOSTNAME_STRICT: "true"
      # 0.1.13: el entrypoint de la imagen migra el realm por el Admin API en 127.0.0.1:8080 (puerto fijo), asi que
      # Keycloak escucha en el 8080 interno; el servicio keycloak-relay expone ${KEYCLOAK_PORT} en este mismo
      # contenedor para que PDP/PEP (keycloak.localhost:${KEYCLOAK_PORT}) y el host sigan usando el puerto oficial.
      # 0.1.13: la imagen migra el realm persistido y crea el cliente técnico aprovisionador (identidades de
      # servicio M2M) con este mismo secreto, que también recibe el PDP. Sin valor por defecto: llega de lab.env.
      SECURITY_BASELINE_PROVISIONER_CLIENT_SECRET: ${PDP_KEYCLOAK_PROVISIONER_CLIENT_SECRET:?Configure PDP_KEYCLOAK_PROVISIONER_CLIENT_SECRET}
    networks:
      lab:
        ipv4_address: 172.31.240.10
    volumes:
      - asistencias-security-lab-keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-19090}:${KEYCLOAK_PORT:-19090}"
    healthcheck:
      # 0.1.13: no arranca consumidores hasta que la imagen haya migrado el realm persistido.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080 && test -f /tmp/security-baseline-keycloak-migration-complete'"]
      interval: 5s
      timeout: 3s
      retries: 36

  # Relevo TCP dentro del espacio de red de keycloak: ${KEYCLOAK_PORT} -> 8080 (ver comentario en keycloak).
  keycloak-relay:
    image: alpine/socat:1.8.0.3
    network_mode: "service:keycloak"
    command: ["TCP-LISTEN:${KEYCLOAK_PORT:-19090},fork,reuseaddr", "TCP:127.0.0.1:8080"]
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started

  surrealdb:
    networks: [lab]
    image: surrealdb/surrealdb:v3.3.0
    user: root
    command: ["start", "--user", "${SECURITY_SURREALDB_USERNAME:-root}", "--pass", "${SECURITY_SURREALDB_PASSWORD:?Configure SECURITY_SURREALDB_PASSWORD}", "rocksdb:/data/database"]
    volumes:
      - asistencias-security-lab-surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    networks: [lab]
    # Versión fija (igual que distribution/compose.yaml 0.1.13): un tag flotante cambia Redis sin aviso en cada `pull`.
    image: redis:7.4.12-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - asistencias-security-lab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24

  opa:
    networks: [lab]
    image: ${SECURITY_DOCKER_ORG:?Configure SECURITY_DOCKER_ORG}/security-opa:${SECURITY_VERSION:?Configure SECURITY_VERSION}

  pdp:
    networks: [lab]
    extra_hosts:
      - "keycloak.localhost:172.31.240.10"
    image: ${SECURITY_DOCKER_ORG:?Configure SECURITY_DOCKER_ORG}/security-pdp:${SECURITY_VERSION:?Configure SECURITY_VERSION}
    environment:
      SPRING_PROFILES_ACTIVE: prod,keycloak
      PDP_DATASOURCE_URL: http://surrealdb:8000
      PDP_DATASOURCE_USERNAME: ${SECURITY_SURREALDB_USERNAME:-root}
      PDP_DATASOURCE_PASSWORD: ${SECURITY_SURREALDB_PASSWORD:?Configure SECURITY_SURREALDB_PASSWORD}
      PDP_REDIS_HOST: redis
      PDP_OPA_BASE_URL: http://opa:8181
      PDP_INTERNAL_MTLS_ENABLED: "false"
      # 0.1.13: el PDP aprovisiona clientes M2M (identidades de servicio) por el Admin API: dentro de Docker usa el
      # nombre del servicio y el puerto interno de Keycloak (8080), no keycloak.localhost.
      PDP_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      PDP_KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${PDP_KEYCLOAK_PROVISIONER_CLIENT_SECRET:?Configure PDP_KEYCLOAK_PROVISIONER_CLIENT_SECRET}
      PDP_KEYCLOAK_ISSUER: http://keycloak.localhost:${KEYCLOAK_PORT:-19090}/realms/security-baseline
      PDP_KEYCLOAK_CLIENT_ID: security-baseline-bff
      PDP_KEYCLOAK_CLIENT_SECRET: ${SECURITY_PDP_KEYCLOAK_CLIENT_SECRET:?Configure SECURITY_PDP_KEYCLOAK_CLIENT_SECRET}
      PDP_KEYCLOAK_BEARER_AUDIENCE: security-baseline-pdp
      PDP_SECURITY_SESSION_SECURE_COOKIES: "false"
      # Origenes de la SPA de AsistenciasUCO autorizados a recuperar su URL tras el login BFF del PDP (allow-list,
      # nunca un reflejo libre de return_to). El login del PDP aprovisiona la identidad del usuario en el catalogo.
      PDP_SECURITY_LOGIN_ALLOWED_RETURN_ORIGINS: ${PDP_SECURITY_LOGIN_ALLOWED_RETURN_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # Nombres que consume el PDP desde 0.1.7 (antes los inyectaba un override externo): allow-list exacta de
      # return_to y orígenes CORS del canal Bearer (GUIA-INTEGRACION 9.1). Nunca `*`.
      PDP_LOGIN_ALLOWED_RETURN_ORIGINS: ${PDP_LOGIN_ALLOWED_RETURN_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      PDP_CORS_ALLOWED_ORIGINS: ${PDP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      # Destino del logout BFF del PDP (cierra la sesion BFF y la sesion SSO de Keycloak y vuelve a la SPA).
      PDP_FRONTEND_ORIGIN: ${PDP_FRONTEND_ORIGIN:-http://localhost:4200}
      PDP_SECURITY_MFA_ENABLED: ${PDP_SECURITY_MFA_ENABLED:-false}
    ports:
      - "127.0.0.1:${PDP_PORT:-18080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      surrealdb:
        condition: service_healthy
      redis:
        condition: service_healthy

  pep:
    networks: [lab]
    extra_hosts:
      - "keycloak.localhost:172.31.240.10"
    image: ${SECURITY_DOCKER_ORG:?Configure SECURITY_DOCKER_ORG}/security-pep:${SECURITY_VERSION:?Configure SECURITY_VERSION}
    environment:
      PEP_INGRESS_ALLOWINSECUREHTTP: "true"
      PEP_INGRESS_ISSUER: http://keycloak.localhost:${KEYCLOAK_PORT:-19090}/realms/security-baseline
      PEP_INGRESS_JWKSURI: http://keycloak.localhost:${KEYCLOAK_PORT:-19090}/realms/security-baseline/protocol/openid-connect/certs
      PEP_PDP_ALLOWINSECUREHTTP: "true"
      PEP_PDP_BASE_URL: http://pdp:8080
      PEP_KEYCLOAK_TOKEN_URI: http://keycloak.localhost:${KEYCLOAK_PORT:-19090}/realms/security-baseline/protocol/openid-connect/token
      # Relaxed binding de pep.pdp.service-identity.client-secret (literal en la imagen upstream).
      PEP_PDP_SERVICEIDENTITY_CLIENTSECRET: ${SECURITY_PEP_INTERNAL_CLIENT_SECRET:?Configure SECURITY_PEP_INTERNAL_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${PEP_PORT:-18081}:8081"
    depends_on:
      keycloak:
        condition: service_healthy
      pdp:
        condition: service_started

networks:
  lab:
    name: asistencias-security-lab-net
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  asistencias-security-lab-keycloak-data:
  asistencias-security-lab-surrealdb-data:
  asistencias-security-lab-redis-data:
