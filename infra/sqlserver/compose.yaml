# SQL Server de desarrollo (base habitual: gestionasistenciadb, puerto 1433).
# Describe el contenedor existente `sql_server_asistencias`: reutiliza su volumen de datos (external) para que
# `docker compose up` jamas cree una base vacia ni duplique datos. El esquema lo administra el repositorio DB.
# Secretos: MSSQL_SA_PASSWORD viene de infra/sqlserver/.env (ignorado por Git), nunca del repositorio.
# La aplicacion NO usa `sa`: usa un login de runtime miembro de rol_asistencias_runtime (ver infra/README).
name: asistencias-sqlserver

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_asistencias
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD en infra/sqlserver/.env}
    ports:
      - "${SQL_BIND_IP:-127.0.0.1}:${SQL_HOST_PORT:-1433}:1433"
    volumes:
      - sql_server_asistencias_data:/var/opt/mssql

volumes:
  sql_server_asistencias_data:
    external: true
