name: asistencias-uco-security

services:

  keycloak-db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${KC_DB_DATABASE}
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}

    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

    networks:
      - keycloak-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KC_DB_USERNAME} -d ${KC_DB_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    restart: unless-stopped

    command:
      - start-dev

    depends_on:
      keycloak-db:
        condition: service_healthy

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    ports:
      - "127.0.0.1:${KC_HTTP_PORT}:8080"
      - "127.0.0.1:${KC_MANAGEMENT_PORT}:9000"

    networks:
      - keycloak-network


volumes:
  keycloak_db_data:


networks:
  keycloak-network:
    driver: bridge
