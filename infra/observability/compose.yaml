name: asistencias-uco-observability

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3000/api/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9090/-/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:${LOKI_VERSION}
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - observability-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3100/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "127.0.0.1:${TEMPO_PORT}:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - observability-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3200/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  alloy:
    image: grafana/alloy:${ALLOY_VERSION}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT}:12345"
      - "127.0.0.1:${ALLOY_OTLP_HTTP_PORT}:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/asistencias-uco:ro
    networks:
      - observability-network

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:

networks:
  observability-network:
    driver: bridge
